name: iOS Tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'

jobs:
  swift-test:
    name: Swift Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test DejaGrooveAuth
        working-directory: ios/DejaGrooveAuth
        run: swift test --parallel

      - name: Test DejaGrooveApp
        working-directory: ios/DejaGrooveApp
        run: swift test --parallel

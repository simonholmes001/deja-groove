name: Backend Container Publish

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-container-publish.yml"
      - "backend/src/DejaGroove.Api/Dockerfile"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Channel tag to publish (dev|staging|prod)"
        required: false
        default: "dev"

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: dev
    outputs:
      image_ref: ${{ steps.image_ref.outputs.value }}
    env:
      IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/deja-groove-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate required secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "Missing required secret: DOCKERHUB_USERNAME" >&2
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Missing required secret: DOCKERHUB_TOKEN" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and validate release channel
        shell: bash
        run: |
          set -euo pipefail
          release_channel="${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || 'dev' }}"
          case "$release_channel" in
            dev|staging|prod) ;;
            *)
              echo "::error::release_channel must be one of dev|staging|prod"
              exit 1
              ;;
          esac
          echo "RELEASE_CHANNEL=$release_channel" >> "$GITHUB_ENV"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/src/DejaGroove.Api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}

      - name: Capture immutable image reference
        id: image_ref
        shell: bash
        run: echo "value=${IMAGE_REPO}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Vulnerability scan gate
        shell: bash
        run: |
          set -euo pipefail
          trivy_exit_code=1
          if [ "${RELEASE_CHANNEL}" = "dev" ]; then
            trivy_exit_code=0
            echo "::warning::Dev channel scan is non-blocking; HIGH/CRITICAL findings are reported but do not fail publish."
          fi
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 \
            image \
            --scanners vuln \
            --skip-version-check \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code "${trivy_exit_code}" \
            "${{ steps.image_ref.outputs.value }}"

      - name: Promote release channel tag after scan
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:${RELEASE_CHANNEL}-latest" \
            "${{ steps.image_ref.outputs.value }}"

  deploy-dev:
    name: Deploy Dev Infra With Published Image
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'dev' }}
    uses: ./.github/workflows/infrastructure-deploy-dev.yaml
    with:
      docker_image_reference: ${{ needs.publish.outputs.image_ref }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      ENTRA_OIDC_CONFIG_URL: ${{ secrets.ENTRA_OIDC_CONFIG_URL }}
      ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}

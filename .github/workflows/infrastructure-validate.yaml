name: Minimal Azure Function Validate (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "functions/**"
      - ".github/workflows/infrastructure-validate.yaml"
      - ".github/workflows/infrastructure-deploy-dev.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  validate-dev:
    name: Validate Dev Function Proxy
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect minimal Function template
        id: detect
        shell: bash
        run: |
          if [ -f infrastructure/bicep/minimal-function.bicep ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "minimal-function.bicep is not present yet; Azure validation is skipped."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/recognition-proxy/package-lock.json

      - name: Test recognition Function
        if: steps.detect.outputs.exists == 'true'
        working-directory: functions/recognition-proxy
        run: |
          npm ci --workspaces=false
          npm run test

      - name: Run infrastructure guard tests
        if: steps.detect.outputs.exists == 'true'
        run: bash ./infrastructure/scripts/guard-tests.sh

      - name: Lint minimal Function infrastructure
        if: steps.detect.outputs.exists == 'true'
        run: bash ./infrastructure/scripts/validate.sh dev --lint-only

      - name: Login to Azure (OIDC)
        if: steps.detect.outputs.exists == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate minimal Function infrastructure
        if: steps.detect.outputs.exists == 'true'
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: bash ./infrastructure/scripts/validate.sh dev

      - name: Run minimal Function what-if
        if: steps.detect.outputs.exists == 'true'
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: bash ./infrastructure/scripts/validate.sh dev --what-if

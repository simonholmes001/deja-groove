name: Infrastructure Validate (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-validate.yaml"
      - ".github/workflows/infrastructure-deploy-dev.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  bicep-build:
    name: Bicep Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build main Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep install
            az bicep build --file infrastructure/bicep/main.bicep

  validate-dev:
    name: Dev ARM Validate
    runs-on: ubuntu-latest
    needs: bicep-build
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment secrets
        shell: bash
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_POSTGRES_ADMIN_LOGIN:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_LOGIN secret."
            exit 1
          fi
          if [ -z "${AZURE_POSTGRES_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_PASSWORD secret."
            exit 1
          fi

      - name: ARM validate dev deployment
        uses: azure/cli@v2
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail
            az account show --query "{name:name, subscriptionId:id}" -o table
            az deployment group validate \
              --resource-group "rg-deja-dev" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters infrastructure/bicep/parameters/dev.bicepparam \
              --parameters postgresAdministratorLogin="${AZURE_POSTGRES_ADMIN_LOGIN}" \
              --parameters postgresAdministratorLoginPassword="${AZURE_POSTGRES_ADMIN_PASSWORD}" \
              --output none

  what-if-dev:
    name: Dev What-If
    runs-on: ubuntu-latest
    needs: validate-dev
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment secrets
        shell: bash
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_POSTGRES_ADMIN_LOGIN:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_LOGIN secret."
            exit 1
          fi
          if [ -z "${AZURE_POSTGRES_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_PASSWORD secret."
            exit 1
          fi

      - name: Run what-if for dev deployment
        uses: azure/cli@v2
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail
            az account show --query "{name:name, subscriptionId:id}" -o table
            az deployment group what-if \
              --name "deja-dev-whatif-${{ github.run_id }}" \
              --resource-group "rg-deja-dev" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters infrastructure/bicep/parameters/dev.bicepparam \
              --parameters postgresAdministratorLogin="${AZURE_POSTGRES_ADMIN_LOGIN}" \
              --parameters postgresAdministratorLoginPassword="${AZURE_POSTGRES_ADMIN_PASSWORD}"

name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Compute next release
        id: release
        shell: bash
        run: ./.github/scripts/compute-next-release.sh

      - name: Skip when no changeset requires release
        if: steps.release.outputs.should_release != 'true'
        run: echo "No pending changeset files since ${{ steps.release.outputs.latest_tag }}; skipping release."

      - name: Create tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.next_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping tag creation."
            exit 0
          fi
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.next_tag }}"
          gh release view "${tag}" >/dev/null 2>&1 && {
            echo "Release ${tag} already exists; skipping."
            exit 0
          }
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --generate-notes

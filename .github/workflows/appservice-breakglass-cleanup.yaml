name: App Service Break-Glass Cleanup (Dev)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove expired break-glass rules
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            rg="rg-deja-dev-app"
            readarray -t apps < <(az webapp list -g "$rg" --query "[?starts_with(name, 'app-deja-api-dev-')].name" -o tsv)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one dev app service in $rg, found ${#apps[@]}."
              exit 1
            fi
            app_name="${apps[0]}"
            now_epoch="$(date -u +%s)"

            remove_if_expired() {
              local scm_flag="$1"
              local rule_name="$2"
              local show_args=("-g" "$rg" "-n" "$app_name")
              local rm_args=("-g" "$rg" "-n" "$app_name" "--rule-name" "$rule_name")
              local query="ipSecurityRestrictions[?name=='${rule_name}'].description | [0]"
              if [ "$scm_flag" = "true" ]; then
                show_args+=("--scm-site" "true")
                rm_args+=("--scm-site" "true")
                query="scmIpSecurityRestrictions[?name=='${rule_name}'].description | [0]"
              fi

              description="$(az webapp config access-restriction show "${show_args[@]}" --query "$query" -o tsv)"
              if [ -z "$description" ]; then
                return 0
              fi

              expires="${description#breakglass-expires=}"
              if [ "$expires" = "$description" ]; then
                return 0
              fi

              exp_epoch="$(date -u -d "$expires" +%s || echo 0)"
              if [ "$exp_epoch" -gt 0 ] && [ "$now_epoch" -ge "$exp_epoch" ]; then
                az webapp config access-restriction remove "${rm_args[@]}" || true
                echo "Removed expired ${rule_name}."
              fi
            }

            remove_if_expired false breakglass-main
            remove_if_expired true breakglass-scm

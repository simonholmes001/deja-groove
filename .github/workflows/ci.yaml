name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require changeset for releasable changes
        shell: bash
        run: bash .github/scripts/changeset-check.sh

  codex-review-tests:
    name: Codex Review Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Run Codex review script tests
        run: node --test .github/scripts/*.test.mjs

  release-script-tests:
    name: Repository Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run repository script tests
        shell: bash
        run: |
          bash .github/scripts/compute-next-release.test.sh
          bash .github/scripts/changeset-check.test.sh
          bash .github/scripts/ios-distribution-readiness.test.sh
          bash .github/scripts/validate-ios-project.test.sh
          bash .github/scripts/fastlane-xcode-path-resolution.test.sh
          bash .github/scripts/ios-testflight-workflow.test.sh
          bash .github/scripts/gitignore-ios-artifacts.test.sh

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", "cli", "frontend", "functions/recognition-proxy"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect Node project
        id: detect
        run: |
          if [ -f "${{ matrix.dir }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f "${{ matrix.dir }}/package-lock.json" ]; then
            npm ci --workspaces=false
          else
            npm install
          fi
        working-directory: ${{ matrix.dir }}

      - name: Run tests
        if: steps.detect.outputs.exists == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm run test
          else
            echo "No test script found; skipping."
          fi
        working-directory: ${{ matrix.dir }}

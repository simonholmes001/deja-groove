name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  codex-review-tests:
    name: Codex Review Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run Codex review script tests
        run: node --test .github/scripts/*.test.mjs

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", "cli", "frontend"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect Node project
        id: detect
        run: |
          if [ -f "${{ matrix.dir }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f "${{ matrix.dir }}/package-lock.json" ]; then
            npm ci --workspaces=false
          else
            npm install
          fi
        working-directory: ${{ matrix.dir }}

      - name: Run tests
        if: steps.detect.outputs.exists == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm run test
          else
            echo "No test script found; skipping."
          fi
        working-directory: ${{ matrix.dir }}

  dotnet-tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ["backend", "."]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect .NET project
        id: detect
        run: |
          if find "${{ matrix.dir }}" -maxdepth 1 \( -name '*.sln' -o -name '*.csproj' \) 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project found in ${{ matrix.dir }}; skipping."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Run tests
        if: steps.detect.outputs.exists == 'true'
        run: dotnet test "${{ matrix.dir }}" --verbosity normal

  ios-tests:
    name: iOS Tests (Swift Package)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect iOS changes
        id: detect
        run: |
          # Always run on main; on other branches only when ios/ files changed.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^ios/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No iOS changes detected — skipping Swift tests."
          fi

      - name: Run Swift tests with coverage
        if: steps.detect.outputs.changed == 'true'
        run: swift test --package-path ios/DejaGrooveAuth --enable-code-coverage

      - name: Report coverage path
        if: steps.detect.outputs.changed == 'true'
        run: |
          COVERAGE_PATH="$(swift test --package-path ios/DejaGrooveAuth --show-codecov-path 2>/dev/null || true)"
          if [ -n "$COVERAGE_PATH" ]; then
            echo "Coverage JSON: $COVERAGE_PATH"
          fi

name: Infrastructure Deploy (Dev)

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-deploy-dev.yaml"
      - ".github/workflows/infrastructure-validate.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev Infrastructure
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment secrets
        shell: bash
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_POSTGRES_ADMIN_LOGIN:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_LOGIN secret."
            exit 1
          fi
          if [ -z "${AZURE_POSTGRES_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_PASSWORD secret."
            exit 1
          fi
          echo "LOGIN_LEN=${#AZURE_POSTGRES_ADMIN_LOGIN}"
          echo -n "$AZURE_POSTGRES_ADMIN_LOGIN" | sha256sum
          echo "PASS_LEN=${#AZURE_POSTGRES_ADMIN_PASSWORD}"
          echo -n "$AZURE_POSTGRES_ADMIN_PASSWORD" | sha256sum

      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep install
            az bicep build --file infrastructure/bicep/main.bicep

      - name: Deploy dev infrastructure (subscription scope)
        uses: azure/cli@v2
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          ENTRA_OIDC_CONFIG_URL: ${{ secrets.ENTRA_OIDC_CONFIG_URL }}
          ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}
        with:
          inlineScript: |
            set -euo pipefail
            az account show --query "{name:name, subscriptionId:id}" -o table
            # Build optional Entra params — omitted until Entra tenant is provisioned (issue #8).
            # When both secrets are present, JWT validation is activated on the APIM gateway.
            EXTRA_PARAMS=()
            if [ -n "${ENTRA_OIDC_CONFIG_URL:-}" ]; then
              EXTRA_PARAMS+=(--parameters "entraOidcConfigUrl=${ENTRA_OIDC_CONFIG_URL}")
              echo "Entra OIDC config URL supplied — JWT validation will be enabled."
            else
              echo "ENTRA_OIDC_CONFIG_URL not set — deploying with IP-based rate limit only (JWT inactive)."
            fi
            if [ -n "${ENTRA_API_CLIENT_ID:-}" ]; then
              EXTRA_PARAMS+=(--parameters "entraApiClientId=${ENTRA_API_CLIENT_ID}")
            fi
            set +e
            az deployment sub create \
              --name "deja-dev-deploy-${{ github.run_id }}" \
              --location "swedencentral" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters infrastructure/bicep/parameters/dev.bicepparam \
              --parameters postgresAdministratorLogin="${AZURE_POSTGRES_ADMIN_LOGIN}" \
              --parameters postgresAdministratorLoginPassword="${AZURE_POSTGRES_ADMIN_PASSWORD}" \
              "${EXTRA_PARAMS[@]+"${EXTRA_PARAMS[@]}"}" \
              --output table
            deploy_rc=$?
            set -e
            if [ "$deploy_rc" -ne 0 ]; then
              echo "----- SUB DEPLOYMENT FAILED OPERATIONS -----"
              az deployment operation sub list \
                --name "deja-dev-deploy-${{ github.run_id }}" \
                --query "[?properties.provisioningState=='Failed'].properties.statusMessage" \
                -o jsonc || true
              echo "----- DATA RG NESTED DEPLOYMENT FAILED OPERATIONS -----"
              az deployment operation group list \
                --resource-group "rg-deja-dev-data" \
                --name "deja-postgresql-dev" \
                --query "[?properties.provisioningState=='Failed'].properties.statusMessage" \
                -o jsonc || true
              exit "$deploy_rc"
            fi

      - name: Verify App Service direct ingress is blocked
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            deployment_name="deja-dev-deploy-${{ github.run_id }}"
            app_host="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.webAppHostname.value" -o tsv)"
            apim_gateway="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.apimGatewayUrl.value" -o tsv)"
            if [ -z "$app_host" ]; then
              echo "::error::Unable to resolve webAppHostname output from deployment."
              exit 1
            fi
            if [ -z "$apim_gateway" ]; then
              echo "::error::Unable to resolve apimGatewayUrl output from deployment."
              exit 1
            fi
            rg="rg-deja-dev-app"
            app_name="${app_host%%.*}"

            main_default_action="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "ipSecurityRestrictionsDefaultAction" -o tsv)"
            scm_default_action="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "scmIpSecurityRestrictionsDefaultAction" -o tsv)"
            total_allow_count="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "length(ipSecurityRestrictions[?action=='Allow'])" -o tsv)"
            apim_allow_count="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "length(ipSecurityRestrictions[?name=='allow-apim-service-tag' && action=='Allow' && tag=='ServiceTag' && ipAddress=='ApiManagement'])" -o tsv)"
            scm_allow_count="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "length(scmIpSecurityRestrictions[?action=='Allow'])" -o tsv)"
            if [ "$main_default_action" != "Deny" ] || [ "$scm_default_action" != "Deny" ] || [ "$apim_allow_count" != "1" ] || [ "$total_allow_count" != "1" ] || [ "$scm_allow_count" != "0" ]; then
              echo "::error::Access restriction policy assertion failed (main/scm default deny and APIM allow rule required)."
              az webapp config access-restriction show -g "$rg" -n "$app_name" --output jsonc
              exit 1
            fi

            status_code="$(curl -s -o /dev/null -w '%{http_code}' "https://${app_host}/health" || true)"
            echo "Direct app health HTTP status: ${status_code}"

            if [ "$status_code" != "403" ]; then
              echo "::error::Direct App Service ingress check failed. Expected 403 but got ${status_code}."
              exit 1
            fi

            echo "Direct App Service ingress is not publicly reachable (expected)."

            apim_status="$(curl -s -o /dev/null -w '%{http_code}' "${apim_gateway}/api/health" || true)"
            echo "APIM health route HTTP status: ${apim_status}"

            if [ "$apim_status" != "200" ]; then
              echo "::error::APIM health route failed. Expected 200 but got ${apim_status}."
              exit 1
            fi

            echo "APIM route is reachable."

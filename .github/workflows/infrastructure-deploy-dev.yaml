name: Minimal Azure Function Deploy (Dev)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: minimal-function-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev Function Proxy
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate minimal Function secrets
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_KEY:-}" ]; then
            echo "::error::Missing OPENAI_KEY secret for the minimal Azure Function proxy."
            exit 1
          fi

      - name: Deploy minimal Function infrastructure
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: bash ./infrastructure/scripts/deploy.sh dev

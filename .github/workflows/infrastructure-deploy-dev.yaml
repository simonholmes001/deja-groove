name: Infrastructure Deploy (Dev)

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure-deploy-dev.yaml"
      - ".github/workflows/infrastructure-validate.yaml"
      - ".github/workflows/appservice-breakglass-access.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy Dev Infrastructure
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment secrets
        shell: bash
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_POSTGRES_ADMIN_LOGIN:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_LOGIN secret."
            exit 1
          fi
          if [ -z "${AZURE_POSTGRES_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Missing AZURE_POSTGRES_ADMIN_PASSWORD secret."
            exit 1
          fi

      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az bicep install
            az bicep build --file infrastructure/bicep/main.bicep

      - name: Deploy dev infrastructure (subscription scope)
        uses: azure/cli@v2
        env:
          AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail
            az account show --query "{name:name, subscriptionId:id}" -o table
            az deployment sub create \
              --name "deja-dev-deploy-${{ github.run_id }}" \
              --location "swedencentral" \
              --template-file infrastructure/bicep/main.bicep \
              --parameters infrastructure/bicep/parameters/dev.bicepparam \
              --parameters postgresAdministratorLogin="${AZURE_POSTGRES_ADMIN_LOGIN}" \
              --parameters postgresAdministratorLoginPassword="${AZURE_POSTGRES_ADMIN_PASSWORD}" \
              --output table

      - name: Restrict App Service ingress to this APIM instance
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            deployment_name="deja-dev-deploy-${{ github.run_id }}"
            app_host="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.webAppHostname.value" -o tsv)"
            apim_name="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.apimName.value" -o tsv)"
            rg="rg-deja-dev-app"
            app_name="${app_host%%.*}"

            if [ -z "$apim_name" ] || [ -z "$app_name" ]; then
              echo "::error::Unable to resolve app/APIM names from deployment outputs."
              exit 1
            fi

            ip_list="$(az apim show -g "$rg" -n "$apim_name" --query "publicIPAddresses" -o tsv)"
            if [ -z "$ip_list" ]; then
              echo "::error::No APIM outbound public IPs found; cannot enforce instance-specific ingress."
              exit 1
            fi

            existing_rules="$(az webapp config access-restriction show -g "$rg" -n "$app_name" --query "ipSecurityRestrictions[?starts_with(name, 'allow-apim-egress-')].name" -o tsv || true)"
            for rule in $existing_rules; do
              az webapp config access-restriction remove -g "$rg" -n "$app_name" --rule-name "$rule" || true
            done

            priority=100
            index=1
            for ip in $ip_list; do
              az webapp config access-restriction add \
                --resource-group "$rg" \
                --name "$app_name" \
                --rule-name "allow-apim-egress-${index}" \
                --action Allow \
                --priority "$priority" \
                --ip-address "${ip}/32"
              priority=$((priority + 1))
              index=$((index + 1))
            done

            az webapp config access-restriction show -g "$rg" -n "$app_name" --query "ipSecurityRestrictions[].{name:name,action:action,priority:priority,ip:ipAddress}" -o table

      - name: Verify App Service direct ingress is blocked
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            deployment_name="deja-dev-deploy-${{ github.run_id }}"
            app_host="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.webAppHostname.value" -o tsv)"
            apim_gateway="$(az deployment sub show --name "$deployment_name" --query "properties.outputs.apimGatewayUrl.value" -o tsv)"
            if [ -z "$app_host" ]; then
              echo "::error::Unable to resolve webAppHostname output from deployment."
              exit 1
            fi
            if [ -z "$apim_gateway" ]; then
              echo "::error::Unable to resolve apimGatewayUrl output from deployment."
              exit 1
            fi

            status_code="$(curl -s -o /dev/null -w '%{http_code}' "https://${app_host}/health" || true)"
            echo "Direct app health HTTP status: ${status_code}"

            if [ "$status_code" != "403" ] && [ "$status_code" != "401" ]; then
              echo "::error::Direct App Service ingress check failed. Expected 401/403 but got ${status_code}."
              exit 1
            fi

            echo "Direct App Service ingress is not publicly reachable (expected)."

            apim_status="$(curl -s -o /dev/null -w '%{http_code}' "${apim_gateway}/api/health" || true)"
            echo "APIM health route HTTP status: ${apim_status}"

            if [ "$apim_status" = "000" ] || [ "$apim_status" -ge 500 ]; then
              echo "::error::APIM health route failed (status ${apim_status})."
              exit 1
            fi

            echo "APIM route is reachable."

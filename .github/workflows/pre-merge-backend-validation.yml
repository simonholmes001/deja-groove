name: Pre-Merge Backend Validation

on:
  workflow_dispatch:
    inputs:
      docker_image_reference:
        description: "Docker image to deploy in dev (tag or digest). Example: simonholmes001/deja-groove-api:dev-latest"
        required: true
        default: "simonholmes001/deja-groove-api:dev-latest"

permissions:
  contents: read
  id-token: write

jobs:
  contracts:
    name: Contract Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Backend container publish workflow contract
        run: bash .github/scripts/backend-container-publish-workflow.test.sh

      - name: Backend container readiness contract
        run: bash .github/scripts/backend-container-readiness.test.sh

      - name: Backend Dockerfile contract
        run: bash .github/scripts/backend-dockerfile-contract.test.sh

  deploy-dev:
    name: Deploy Dev (Reusable Workflow)
    needs: contracts
    uses: ./.github/workflows/infrastructure-deploy-dev.yaml
    with:
      docker_image_reference: ${{ inputs.docker_image_reference }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_POSTGRES_ADMIN_LOGIN: ${{ secrets.AZURE_POSTGRES_ADMIN_LOGIN }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      ENTRA_OIDC_CONFIG_URL: ${{ secrets.ENTRA_OIDC_CONFIG_URL }}
      ENTRA_API_CLIENT_ID: ${{ secrets.ENTRA_API_CLIENT_ID }}

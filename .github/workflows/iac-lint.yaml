name: Minimal Azure IaC Lint

on:
  push:
    branches: [main, "feature/**", "platform/**"]
    paths:
      - "infrastructure/**"
      - "functions/**"
      - ".github/workflows/iac-lint.yaml"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "functions/**"
      - ".github/workflows/iac-lint.yaml"

jobs:
  bicep-lint:
    name: Minimal Function Bicep Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate minimal Function IaC
        run: bash ./infrastructure/scripts/validate.sh dev --lint-only

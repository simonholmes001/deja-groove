name: IaC Lint

on:
  push:
    branches: [main, "feature/**", "platform/**"]
    paths:
      - "infrastructure/bicep/**"
      - "infrastructure/scripts/check-apim-policy.sh"
      - "infrastructure/scripts/check-apim-policy.test.sh"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/bicep/**"
      - "infrastructure/scripts/check-apim-policy.sh"
      - "infrastructure/scripts/check-apim-policy.test.sh"

jobs:
  bicep-lint:
    name: Bicep Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: APIM policy sanity check
        run: bash ./infrastructure/scripts/check-apim-policy.sh

      - name: APIM policy sanity tests
        run: bash ./infrastructure/scripts/check-apim-policy.test.sh

      - name: Install Bicep CLI
        run: az bicep install

      - name: Lint
        run: az bicep lint --file infrastructure/bicep/main.bicep

      - name: Build (compile all modules)
        run: az bicep build --file infrastructure/bicep/main.bicep --outfile /dev/null
